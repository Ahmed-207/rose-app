<div class="relative">
    <input [type]="showPassword() ? 'text' : 'password'" [value]="value()" [placeholder]="placeholder"
        [disabled]="disabled()" (input)="onInput($event)" (blur)="onTouched()"
        class="w-full px-4 py-3 bg-gray-50 dark:bg-[#2d3748] border border-gray-200 dark:border-gray-700 rounded-xl text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#741c21]/20 focus:border-[#741c21] dark:focus:ring-[#ffc2cc]/20 dark:focus:border-[#ffc2cc] transition-all text-start" />
    <button type="button" (click)="toggleVisibility()" [disabled]="disabled()"
        class="absolute inset-e-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors flex items-center justify-center">
        <i class="pi" [class.pi-eye]="showPassword()" [class.pi-eye-slash]="!showPassword()"></i>
    </button>
</div>
