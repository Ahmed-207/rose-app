@if (product(); as item) {
<div class="product-detail">
  <div class="max-w-7xl mx-auto px-4">
    <section class="product-detail__hero">
      <app-product-gallery [images]="item.images" [(selectedIndex)]="selectedImageIndex">
      </app-product-gallery>

      <app-product-info
        [product]="item"
        (addToCart)="onAddToCart($event)"
        (wishlistToggle)="onWishlistToggle($event)">
      </app-product-info>
    </section>

    <app-product-reviews [product]="item" (reviewAdded)="onReviewAdded($event)"></app-product-reviews>
    <app-related-products-section [currentProductId]="productId()"></app-related-products-section>
  </div>
</div>
}
