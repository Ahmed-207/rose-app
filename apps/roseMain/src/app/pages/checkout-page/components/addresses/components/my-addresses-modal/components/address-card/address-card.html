<div class="relative border rounded-2xl p-6 mt-2 w-full pr-14 bg-white dark:bg-[#202938]" [class]="{
        'border-zinc-200 dark:border-zinc-700': !isMainAddress(),
        'border-red-800 dark:border-pink-300': isMainAddress()
    }">

    <!-- Legend label positioned on the top border -->
    <span
        class="absolute -top-3 left-5 bg-white dark:bg-[#202938] px-2 text-base font-bold text-rose-800 dark:text-pink-300">
        {{cardTitle()}}
    </span>

    <!-- Content grid -->
    <div class="flex items-start justify-between w-full gap-4">

        <!-- Left: icon and details -->
        <div class="flex flex-col items-start gap-3">
            <div class="flex items-center gap-2">
                <div
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-emerald-500 text-white shrink-0 shadow-sm">
                    <svg lucideMapPin [size]="22"></svg>
                </div>
                <h3 class="text-xl font-bold text-zinc-900 dark:text-white leading-tight">{{cardCity()}}</h3>
            </div>
            <div class="w-full">
                <p
                    class="inline-block rounded-lg bg-zinc-100 dark:bg-zinc-800 px-3 py-1.5 text-sm font-medium text-zinc-700 dark:text-zinc-200 wrap-break-words">
                    {{cardStreet()}}
                </p>
            </div>
        </div>

        <!-- Right: phone -->
        <div class="flex items-center shrink-0 pt-2">
            <div class="flex items-center gap-2 text-zinc-600 dark:text-zinc-300 font-semibold text-base">
                <svg lucidePhone [size]="18" class="text-zinc-500 dark:text-zinc-400"></svg>
                <span>{{cardPhone()}}</span>
            </div>
        </div>
    </div>

    <!-- Action buttons -->
    <div class="flex flex-col gap-2 absolute -right-4.5 top-1/2 -translate-y-1/2 z-10">
        <button
            class="flex h-9 w-9 items-center justify-center rounded-full border border-zinc-300 dark:border-zinc-600 text-zinc-500 dark:text-zinc-300 bg-white dark:bg-[#202938] hover:bg-zinc-50 dark:hover:bg-zinc-700 transition-colors shadow-sm"
            (click)="editAddress()">
            <svg lucidePencil [size]="16"></svg>
        </button>

        <button
            class="flex h-9 w-9 items-center justify-center rounded-full bg-rose-600 dark:bg-pink-300 text-white dark:text-zinc-900 hover:bg-rose-700 dark:hover:bg-pink-400 transition-colors shadow-sm"
            (click)="deleteAddress()">
            <svg lucideTrash2 [size]="16"></svg>
        </button>
    </div>
</div>
