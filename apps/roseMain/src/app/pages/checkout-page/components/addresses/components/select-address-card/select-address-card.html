<div class="relative border rounded-2xl p-6 mt-2 w-full transition-all duration-200"
    [class.bg-transperant]="!isSelected()" [class.bg-red-800]="isSelected()" [class.dark:bg-pink-300]="isSelected()"
    [class.border-zinc-200]="!isSelected() && !isMainAddress()"
    [class.dark:border-zinc-700]="!isSelected() && !isMainAddress()"
    [class.border-red-800]="isSelected() || isMainAddress()"
    [class.dark:border-pink-300]="isSelected() || isMainAddress()" (click)="onCardClick()">
    <!-- Content grid -->
    <div class="flex items-start justify-between w-full gap-4">

        <!-- Left: icon and details -->
        <div class="flex flex-col items-start gap-3">
            <div class="flex items-center gap-2">
                <h3 class="text-xl font-bold leading-tight transition-colors duration-200"
                    [class]="isSelected() ? 'text-white dark:text-zinc-900' : 'text-zinc-900 dark:text-white'">
                    {{cardCity()}}
                </h3>
            </div>
            <div class="w-full">
                <!-- Street badge background adjustments when active -->
                <p class="inline-block rounded-lg px-3 py-1.5 text-sm font-medium wrap-break-words transition-colors duration-200"
                    [class]="isSelected() ? 'bg-red-900/30 text-white dark:bg-pink-400/30 dark:text-zinc-900' : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-200'">
                    {{cardStreet()}}
                </p>
            </div>
        </div>

        <!-- Right: phone -->
        <div class="flex items-center shrink-0 pt-2">
            <div class="flex items-center gap-2 font-semibold text-base transition-colors duration-200"
                [class]="isSelected() ? 'text-white dark:text-zinc-900' : 'text-zinc-600 dark:text-zinc-300'">
                <svg lucidePhone [size]="18" class="transition-colors duration-200"
                    [class]="isSelected() ? 'text-white dark:text-zinc-900' : 'text-zinc-500 dark:text-zinc-400'"></svg>
                <span>{{cardPhone()}}</span>
            </div>
        </div>
    </div>
</div>
