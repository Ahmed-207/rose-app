<div
    class="w-full flex flex-col items-center justify-center border-2 border-dashed border-zinc-200 dark:border-zinc-700 rounded-2xl p-10 bg-zinc-50/50 dark:bg-zinc-800/50 text-center transition-all my-auto">

    <!-- Icon -->
    <div
        class="relative flex h-16 w-16 items-center justify-center rounded-full bg-rose-50 dark:bg-zinc-800 text-rose-800 dark:text-pink-300 mb-4 animate-bounce-short">
        <svg lucideMapPinPlus [size]="32" strokeWidth="1.75"></svg>

        <span class="absolute top-0 right-0 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
    </div>

    <!-- Copy -->
    <div class="max-w-xs space-y-1.5 mb-6">
        <h3 class="text-xl font-bold text-zinc-900 dark:text-white tracking-tight">
            {{ 'addresses.EMPTY_TITLE' | translate }}
        </h3>
        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400 leading-relaxed">
            {{ 'addresses.EMPTY_DESC' | translate }}
        </p>
    </div>
</div>
