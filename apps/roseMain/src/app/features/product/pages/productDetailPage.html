@if (isLoading()) {
  <div class="product-detail__state">
    <lib-spinner></lib-spinner>
  </div>
} @else if (error()) {
  <div class="product-detail__state product-detail__state--error">
    {{ error() | translate }}
  </div>
} @else if (product(); as item) {
  <div class="product-detail">
    <div class="max-w-7xl mx-auto px-4">
      <section class="product-detail__hero">
        <product-gallery
          [images]="item.images"
          [(selectedIndex)]="selectedImageIndex">
        </product-gallery>

        <product-info [product]="item"></product-info>
      </section>

      <product-reviews [product]="item"></product-reviews>
    </div>
  </div>
}
