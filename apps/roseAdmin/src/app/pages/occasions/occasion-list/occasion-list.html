

<div class="occasions-page">
  <header class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">{{ 'Occasions' | translate }}</h1>
  		<lib-button variant="accent" icon="pi pi-plus" (clicked)="onAddOccasion()">{{"Add Occasions" | translate}} </lib-button>

  </header>

  <div class="mb-4">
    <input
      type="text"
      class="w-full max-w-xs px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500"
      [formControl]="searchControl"
      [placeholder]="'Search' | translate" />
  </div>

  <app-data-table
    [columns]="columns"
    [data]="occasions"
    [totalRecords]="totalRecords"
    [loading]="isLoading"
    [page]="currentPage"
    [limit]="limit"
    (pageChange)="onPageChange($event)"
    (editRow)="onEdit($event)"
    (deleteRow)="onDelete($event)" />
</div>
