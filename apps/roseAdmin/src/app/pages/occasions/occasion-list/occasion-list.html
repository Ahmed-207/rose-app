

<div class="occasions-page">
  <header class="occasions-page__header">
    <h1 class="occasions-page__title">{{ 'Occasions' | translate }}</h1>
  		<lib-button variant="accent" icon="pi pi-plus" (clicked)="onAddOccasion()">{{"Add Occasions" | translate}} </lib-button>

  </header>

  <div class="occasions-page__filters">
    <input
      type="text"
      pInputText
      class="occasions-page__search"
      [formControl]="searchControl"
      [placeholder]="'Search' | translate" />
  </div>

  <app-data-table
    [columns]="columns"
    [data]="occasions"
    [totalRecords]="totalRecords"
    [loading]="isLoading"
    [page]="currentPage"
    [limit]="limit"
    (pageChange)="onPageChange($event)"
    (editRow)="onEdit($event)"
    (deleteRow)="onDelete($event)" />

  @if (occasionToDelete()) {
    <app-confirm-dialog
      [title]="'ADMIN.OCCASIONS.DELETE_CONFIRM_TITLE' | translate"
      [message]="'ADMIN.OCCASIONS.DELETE_CONFIRM_MESSAGE' | translate"
      [confirmLabel]="'ADMIN.OCCASIONS.DELETE_CONFIRM_ACCEPT' | translate"
      [cancelLabel]="'ADMIN.OCCASIONS.DELETE_CONFIRM_REJECT' | translate"
      [loading]="isDeleting()"
      (confirmed)="confirmDelete()"
      (cancelled)="cancelDelete()" />
  }
</div>
