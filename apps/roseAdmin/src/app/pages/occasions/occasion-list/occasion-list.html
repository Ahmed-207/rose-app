

<div class="occasions-page">
  <header class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">{{ 'Occasions' | translate }}</h1>
  		<lib-button variant="accent" icon="pi pi-plus" (clicked)="onAddOccasion()">{{"Add Occasions" | translate}} </lib-button>

  </header>
<div class="occasions-page__filters">
		<input
			type="text"
			pInputText
			class="occasions-page__search"
			[formControl]="searchControl"
			[placeholder]="'Search' | translate" />
	</div>


  <app-data-table
    [columns]="columns"
    [data]="occasions"
    [totalRecords]="totalRecords"
    [loading]="isLoading"
    [page]="currentPage"
    [limit]="limit"
    (pageChange)="onPageChange($event)"
    (editRow)="onEdit($event)"
    (deleteRow)="onDelete($event)" />
</div>

@if (occasionToDelete()) {
  <app-confirm-dialog
    [title]="'Delete Occasion'"
    [message]="'Are you sure you want to delete this occasion?'"
    [confirmLabel]="'Delete'"
    [cancelLabel]="'Cancel'"
    (confirmed)="onConfirmDelete()"
    (cancelled)="onCancelDelete()" />
}
