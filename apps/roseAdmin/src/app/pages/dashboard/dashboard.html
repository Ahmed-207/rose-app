<div class="dashboard">
  <header class="dashboard__header">
    <div>
      <p class="dashboard__eyebrow">{{ 'ADMIN.NAVBAR.DASHBOARD' | translate }}</p>
      <h1>{{ 'ADMIN.NAVBAR.DASHBOARD' | translate }}</h1>
    </div>
    <button type="button" class="dashboard__refresh" (click)="loadStatistics()" [disabled]="isLoading">
      <i class="pi pi-refresh" [class.dashboard__refresh-icon--spinning]="isLoading"></i>
      {{ 'Refresh' | translate }}
    </button>
  </header>
  @if(isLoading){
    <div class="dashboard__message">{{ 'Loading dashboard statistics...' | translate }}</div>
  }
  @if(errorMessage){
  <div class="dashboard__message dashboard__message--error">{{ errorMessage }}</div>
  }
  <div class="dashboard__grid" [class.dashboard__grid--loading]="isLoading">
    <section class="area area--stats">
      <div class="stats-grid">
        <app-stat-card *ngFor="let stat of statCards" [data]="stat"></app-stat-card>
      </div>
    </section>

    <section class="area area--categories">
      <app-list-panel
        title="All Categories"
        [items]="categories"
        [showImage]="false"
        defaultIcon="pi pi-box"
        [maxHeight]="260"
      ></app-list-panel>
    </section>

    <section class="area area--orders">
      <app-orders-status-chart [data]="ordersStatus"></app-orders-status-chart>
    </section>

    <section class="area area--revenue">
      <app-revenue-chart
        [points]="revenuePoints"
        [highlightLabel]="revenueHighlightLabel"
        [highlightValue]="revenueHighlightValue"
        [selectedPeriod]="revenuePeriod"
        (periodChange)="onRevenuePeriodChange($event)"
      ></app-revenue-chart>
    </section>

    <section class="area area--top-selling">
      <app-list-panel
        title="Top Selling Products"
        [items]="topSelling"
        [showImage]="true"
        [maxHeight]="300"
      ></app-list-panel>
    </section>

    <section class="area area--low-stock">
      <app-list-panel
        title="Low Stock Products"
        [items]="lowStock"
        [showImage]="true"
        [maxHeight]="300"
      ></app-list-panel>
    </section>
  </div>
</div>
