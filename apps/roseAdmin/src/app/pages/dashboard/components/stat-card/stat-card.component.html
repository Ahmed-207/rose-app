<div class="stat-card" [ngClass]="'stat-card__--' + data.iconBg">
  <div class="stat-card__icon" [ngClass]="'stat-card__icon--' + data.iconBg">
    <i [class]="data.icon"></i>
  </div>
  <div class="stat-card__body">
    <div class="stat-card__value">
      {{ data.value }}
      @if(data.suffix){
  <span  class="stat-card__suffix">{{ data.suffix }}</span>
      }

    </div>
    <div class="stat-card__label">{{ data.label }}</div>
  </div>
</div>
