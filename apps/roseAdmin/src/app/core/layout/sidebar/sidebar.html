



<div class="admin-sidebar flex flex-col h-full p-4">
  
  <div class="admin-sidebar__brand flex flex-col gap-4 px-2 py-4 mb-4">
    <div class="flex items-center justify-center w-full py-2">
      <img src="assets/images/logo.png" alt="Rose Logo" class="h-14 w-auto object-contain" />
    </div>
    
    <button class="admin-sidebar__preview w-full py-2.5 px-4 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-colors">
      <i class="pi pi-[#A31D36] pi-globe"></i>
      <span>
        {{'ADMIN.SIDEBAR.PREVIEW_WEBSITE' |translate}}
      </span>
    </button>
  </div>

  <nav class="flex-1 space-y-1">
    <a 
      *ngFor="let item of menuItems" 
      [routerLink]="item.path"
      routerLinkActive="admin-sidebar__link--active font-semibold"
      [routerLinkActiveOptions]="{ exact: false }"
      (click)="closeMenu.emit()"
      class="admin-sidebar__link flex items-center gap-3 px-4 py-3 rounded-2xl text-sm transition-all"
    >
    <i class="text-xl" [class]="item.icon "></i>
      <span>{{ item.label | translate}}</span>
    </a>
  </nav>

  <div class="relative mt-auto pt-4 border-t border-gray-100">
    @if (isUserMenuOpen) {
    <div 
    
      class="admin-sidebar__menu absolute bottom-16 left-0 right-0 rounded-xl shadow-lg py-2 z-50 animate-in fade-in slide-in-from-bottom-2"
    >
      <a 
        routerLink="/admin/profile"
        (click)="isUserMenuOpen = false; closeMenu.emit()"
        class="admin-sidebar__menu-link flex items-center gap-3 px-4 py-2 text-sm"
      >
      <i class="pi pi-user"></i>
        <span>        {{'ADMIN.SIDEBAR.PROFILE' |translate}}
</span>
      </a>
      <button 
        (click)="isUserMenuOpen = false; closeMenu.emit()"
        class="admin-sidebar__menu-logout w-full flex items-center gap-3 px-4 py-2 text-sm font-medium"
      >
      <i class="pi pi-sign-out"></i>
        <span>        {{'ADMIN.SIDEBAR.LOGOUT' |translate}}
</span>
      </button>
    </div>
}
    <div class="admin-sidebar__user flex items-center justify-between p-2 pb-0 rounded-xl transition-colors">
      <div class="flex items-center gap-3">
        <img 
          src="assets/images/logo.png" 
          alt="User Avatar" 
          class="w-9 h-9 rounded-full object-cover border border-[var(--border-soft)]"
        />
        <div class="flex flex-col text-start">
          <span class="text-xs font-bold text-[var(--text-primary)]">{{'ADMIN.SIDEBAR.NAME' |translate}}</span>
          <span class="text-[10px] text-[var(--text-secondary)]">admin@rose.com</span>
        </div>
      </div>

      <button 
        (click)="toggleUserMenu()"
        class="admin-sidebar__menu-trigger p-1.5 rounded-lg transition-colors"
      >
      <i class="pi pi-ellipsis-v"></i>
      </button>
    </div>

  </div>
</div>
