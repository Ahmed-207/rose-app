



<div class="flex flex-col h-full p-4 bg-white">
  
  <div class="flex flex-col gap-4 px-2 py-4 mb-4 border-b border-gray-100">
    <div class="flex items-center justify-center w-full py-2">
      <img src="assets/images/logo.png" alt="Rose Logo" class="h-14 w-auto object-contain" />
    </div>
    
    <button class="w-full bg-[#A31D36] hover:bg-[#85162B] text-white py-2.5 px-4 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-colors">
      <i class="pi pi-[#A31D36] pi-globe"></i>
      <span>Preview website</span>
    </button>
  </div>

  <nav class="flex-1 space-y-1">
    <a 
      *ngFor="let item of menuItems" 
      [routerLink]="item.path"
      routerLinkActive="bg-[#EED9DF] text-[#6B1426] font-semibold"
      [routerLinkActiveOptions]="{ exact: false }"
      (click)="closeMenu.emit()"
      class="flex items-center gap-3 px-4 py-3 rounded-2xl text-sm text-gray-600 hover:bg-gray-50 transition-all"
    >
    <i [class]="item.icon + 'text-lg' "></i>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="relative mt-auto pt-4 border-t border-gray-100">
    
    <div 
      *ngIf="isUserMenuOpen" 
      class="absolute bottom-16 left-0 right-0 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50 animate-in fade-in slide-in-from-bottom-2"
    >
      <a 
        routerLink="/profile" 
        (click)="isUserMenuOpen = false; closeMenu.emit()"
        class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"
      >
      <i class="pi pi-user"></i>
        <span>Profile</span>
      </a>
      <button 
        (click)="isUserMenuOpen = false; closeMenu.emit()"
        class="w-full flex items-center gap-3 px-4 py-2 text-sm text-rose-600 hover:bg-rose-50 font-medium"
      >
      <i class="pi pi-sign-out"></i>
        <span>Logout</span>
      </button>
    </div>

    <div class="flex items-center justify-between p-2 pb-0 rounded-xl hover:bg-gray-50 transition-colors">
      <div class="flex items-center gap-3">
        <img 
          src="assets/images/logo.png" 
          alt="User Avatar" 
          class="w-9 h-9 rounded-full object-cover border border-gray-200"
        />
        <div class="flex flex-col text-left">
          <span class="text-xs font-bold text-gray-800">Firstname Lastname</span>
          <span class="text-[10px] text-gray-400">admin@rose.com</span>
        </div>
      </div>

      <button 
        (click)="toggleUserMenu()"
        class="p-1.5 text-gray-400 hover:text-gray-700 rounded-lg hover:bg-gray-100 transition-colors"
      >
      <i class="pi pi-ellipsis-v"></i>
      </button>
    </div>

  </div>
</div>
