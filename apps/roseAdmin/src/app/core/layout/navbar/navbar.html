

<header class="flex items-center justify-between px-4 py-3 bg-white dark:bg-[#202938] border-b border-gray-100 relative w-full">
 
  <div class="flex items-center gap-2">
    <img src="/assets/images/logo.png" alt="Rose Logo" class="w-8 h-8 rounded-full md:hidden" />
    <span class="font-semibold text-gray-500  dark:text-white text-sm">
      {{'ADMIN.NAVBAR.DASHBOARD' | translate}}
    </span>
  </div>

  <div class="hidden md:flex items-center gap-3">
    <lib-ui-lang-switcher></lib-ui-lang-switcher>
    <lib-theme-toggler></lib-theme-toggler>
  </div>

  <div class="flex items-center gap-3 relative md:hidden">

    <button (click)="toggleUserMenu()" class="focus:outline-none">
      <img 
        src="/assets/images/logo.png" 
        alt="User Avatar" 
        class="w-9 h-9 rounded-full object-cover " 
      />
    </button>
    <button 
      (click)="menuClick.emit()" 
      class="md:hidden p-1.5 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
@if (isUserMenuOpen) {
    <div 
      class="absolute end-0 top-12 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50 animate-fadeIn"
    >
      <a routerLink="/profile" class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
        <i class="pi pi-user text-gray-500"></i>
        <span>      {{'ADMIN.NAVBAR.PROFILE' | translate}}
</span>
      </a>
      <button class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50">
        <i class="pi pi-sign-out text-red-500"></i>
        <span>{{'ADMIN.NAVBAR.LOGOUT' | translate}}</span>
      </button>
    </div>
    }
  </div>
</header>
