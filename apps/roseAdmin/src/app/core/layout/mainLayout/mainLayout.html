<div class="admin-shell">
  
  <aside class="admin-shell__sidebar hidden md:flex">
    <app-sidebar class="h-full w-full block"></app-sidebar>
  </aside>
  @if (isMobileMenuOpen()) {
  <div  class="fixed inset-0 z-50 flex md:hidden">
    <div class="admin-shell__backdrop" (click)="toggleMobileMenu()"></div>
    <div class="admin-shell__mobile-menu relative w-64 h-full z-10 shadow-2xl ms-auto flex flex-col">
      <app-sidebar (closeMenu)="toggleMobileMenu()" class="flex-1 min-h-0"></app-sidebar>
      <div class="flex items-center justify-around gap-4 px-6 pb-6 pt-2">
        <lib-ui-lang-switcher></lib-ui-lang-switcher>
        <lib-theme-toggler></lib-theme-toggler>
      </div>
    </div>
  </div>

  }

  <div class="admin-shell__content">
    <app-navbar (menuClick)="toggleMobileMenu()"></app-navbar>

    <main class="admin-shell__main">
      <router-outlet></router-outlet>
    </main>


<div class="admin-shell__mobile-nav md:hidden">
  <nav class="pointer-events-auto relative rounded-3xl shadow-xl flex items-center justify-around px-2 py-2 min-h-16">
    
    <a 
      routerLink="/admin/dashboard"
      routerLinkActive="admin-shell__mobile-link--active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="admin-shell__mobile-link flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all text-[11px] font-medium gap-0.5"
    >
      <i class="pi pi-th-large text-lg"></i>
      <span>
        {{'ADMIN.NAVIGATION.OVERVIEW' | translate}}
      </span>
    </a>

    <a 
      routerLink="/admin/categories" 
      routerLinkActive="admin-shell__mobile-link--active"
      class="admin-shell__mobile-link flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all text-[11px] font-medium gap-0.5"
    >
      <i class="pi pi-list text-lg"></i>
      <span>
        {{'ADMIN.NAVIGATION.CATEGORIES' | translate}}

      </span>
    </a>

    <a 
      routerLink="/admin/occasions" 
      routerLinkActive="admin-shell__mobile-link--active"
      class="admin-shell__mobile-link flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all text-[11px] font-medium gap-0.5"
    >
      <i class="pi pi-calendar text-lg"></i>
      <span>
        {{'ADMIN.NAVIGATION.OCCASIONS' | translate}}

      </span>
    </a>

    <a 
      routerLink="/admin/products" 
      routerLinkActive="admin-shell__mobile-link--active"
      class="admin-shell__mobile-link flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all text-[11px] font-medium gap-0.5"
    >
      <i class="pi pi-box text-lg"></i>
      <span>
        {{'ADMIN.NAVIGATION.PRODUCTS' | translate}}
        
      </span>
    </a>

    <a
      routerLink="/admin/profile"
      routerLinkActive="admin-shell__mobile-link--active"
      class="admin-shell__mobile-link flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all text-[11px] font-medium gap-0.5"
    >
      <i class="pi pi-user text-lg"></i>
      <span>{{ 'ADMIN.SIDEBAR.PROFILE' | translate }}</span>
    </a>

  </nav>
</div>

    <app-footer class="hidden md:block"></app-footer>
  </div>
</div>
