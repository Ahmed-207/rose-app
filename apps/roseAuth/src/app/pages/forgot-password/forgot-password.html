<section class="flex flex-col justify-center items-center gap-4 w-full px-10">
  <div class="welcome-message border-b border-zinc-200 w-full">
    <h1 class="text-red-900 text-center">{{ 'auth.FORGOT_PASSWORD_TITLE' | translate }}</h1>
    <p class="text-center text-zinc-600 mt-2">{{ 'auth.FORGOT_PASSWORD_DESC' | translate }}</p>
  </div>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="submitForgotPassword()"
    class="flex flex-col justify-center items-center gap-2 w-full">
    <div class="card flex justify-center w-full">
      <lib-form-control type="email" formControlName="email" label="auth.EMAIL" placeholder="auth.EMAIL_PLACEHOLDER"
        [required]="true" class="block w-full" />
    </div>

    <div class="login-btn-container w-full p-2 pb-5 border-b border-zinc-200">
      <button class="hover:bg-red-950 bg-red-900 text-white w-full rounded-xl py-3 disabled:opacity-60" type="submit"
        [disabled]="forgotPasswordForm.invalid || isLoading()">
        {{ 'auth.SEND_RESET_LINK' | translate }}
      </button>
    </div>
  </form>

  <div class="register-redirect w-full text-center">
    <span class="block">
      <a class="text-red-900 cursor-pointer font-medium hover:text-red-950" (click)="goToLogin()">
        {{ 'auth.BACK_TO_LOGIN' | translate }}
      </a>
    </span>
  </div>
</section>
