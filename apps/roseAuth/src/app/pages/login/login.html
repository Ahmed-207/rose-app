<section class="flex flex-col justify-center items-center gap-4 w-full px-10">
    <div class="welcome-message border-b border-zinc-200 w-full">
        <h1 class="text-red-900 text-center">{{"WELCOME_BACK" | translate}}</h1>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()"
        class="flex flex-col justify-center items-center gap-2 w-full">

        <div class="card flex justify-center w-full">
            <lib-form-control type="text" formControlName="username" label="USERNAME" placeholder="Enter your name"
                [required]="true" class="block w-full" />
        </div>

        <div class="card flex justify-center w-full">
            <lib-form-control type="password" formControlName="password" label="PASSWORD"
                placeholder="Enter your password" [required]="true" class="block w-full" />
        </div>

        <div class="forgot-password w-full">
            <span class="block text-end cursor-pointer text-red-900" (click)="goToForgotPassword()">{{"FORGOT_PASSWORD"
                | translate}}</span>
        </div>

        <div class="flex items-center justfify-start w-full">
            <p-checkbox inputId="remember" formControlName="remember" [binary]="true" />
            <label for="remember" class="ml-2">{{"REMEMBER_ME" | translate}}</label>
        </div>

        <div class="login-btn-container w-full p-2 pb-5 border-b border-zinc-200">
            <button class="hover:bg-red-950 bg-red-900 text-white w-full rounded-xl py-3" type="submit">
                {{"LOGIN" | translate}}
            </button>
        </div>
    </form>
    <div class="register-redirect w-full text-center">
        <span class="block">
            {{"NO_ACCOUNT" | translate}}
            <a class="text-red-900 cursor-pointer font-medium hover:text-red-950"
                (click)="goToRegister()">{{"CREATE_ONE" | translate}}</a>
        </span>
    </div>
</section>
