<div class="step-wrapper">
      <app-auth-card translationKey="" alternateRoute="">
  <div class="step-header">
    <span class="step-badge">Step 2 of 3</span>
    <h1>{{'Enter the code' | translate}}</h1>
    <p>
     {{"We have sent a 6-digit code to" | translate}}
      <strong>{{ email() }}</strong>.

    <a class="back-link" routerLink="/auth/send-email-verification">{{"Edit" | translate}}</a>

    </p>
  </div>

  <form (ngSubmit)="onSubmit()" novalidate>
    <!-- OTP digit inputs -->
    <div class="otp-slots" (paste)="onPaste($event)">
      @for (digit of digits(); track $index) {
        <input
          #digitInput
          type="text"
          inputmode="numeric"
          maxlength="1"
          class="otp-slot"
          [class.otp-slot--filled]="digit !== ''"
          [value]="digit"
          [attr.aria-label]="'Digit ' + ($index + 1)"
          (input)="onDigitInput($event, $index)"
          (keydown)="onKeydown($event, $index)"
          autocomplete="one-time-code"
        />
      }
    </div>
@if (errorMessage()) {
<p class="server-error" role="alert">
      {{ errorMessage() }}
    </p>
}

    <lib-button
      buttonType="submit"
      variant="danger"
      [loading]="isLoading()"
      [disabled]="!isComplete || isLoading()"
      size="lg"
      >{{'Verify Code' | translate}}</lib-button
    >

  </form>

</app-auth-card>
</div>
