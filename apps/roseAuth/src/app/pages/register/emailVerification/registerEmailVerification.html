<div class="step-wrapper">
      <app-auth-card translationKey="" alternateRoute="">
  <div class="step-header">
    <span class="step-badge">Step 1 of 3</span>
    <h1>{{'Verify your email' | translate}}</h1>
    <p>
      {{"We'll send a one-time code to confirm your address before you create your account." | translate}}
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-form-control formControlName="email" type="email" />
    @if(errorMessage){
    <p class="server-error" role="alert">{{ errorMessage }}</p>
    }

    <lib-button
      variant="danger"
      [loading]="isLoading"
      [disabled]="form.invalid"
      (clicked)="onSubmit()"
      size="lg"
      >{{'Verify Email' | translate}}</lib-button
    >
  </form>
  </app-auth-card>
</div>
