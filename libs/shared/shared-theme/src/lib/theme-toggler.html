<button pRipple type="button" (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    [attr.aria-pressed]="theme.isDark()" [class]="theme.isDark()
    ? 'bg-[#5c1d34] focus-visible:ring-rose-400 focus-visible:ring-offset-gray-900'
    : 'bg-gray-200 focus-visible:ring-[#5c1d34] focus-visible:ring-offset-white'" class="
    relative inline-flex items-center
    w-14 h-7 rounded-full
    cursor-pointer select-none
    transition-colors duration-300 ease-in-out
    focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
  ">
    <span [class]="theme.isDark() ? 'translate-x-7 bg-gray-900' : 'translate-x-0.5 bg-white'" class="
      absolute top-0.5
      w-6 h-6 rounded-full
      flex items-center justify-center
      shadow-sm
      transition-transform duration-300 ease-in-out
    ">
        @if (theme.isDark()) {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-rose-400" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-amber-500" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <line x1="12" y1="2" x2="12" y2="4" />
            <line x1="12" y1="20" x2="12" y2="22" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="2" y1="12" x2="4" y2="12" />
            <line x1="20" y1="12" x2="22" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        }
    </span>

</button>
