<button
      [class]="buttonClass"
      [disabled]="disabled || loading"
      [attr.aria-busy]="loading"
      [attr.aria-label]="loading ? (ariaLabel || 'Loading') : ariaLabel"
      (click)="handleClick()"
    >
    @if(icon && !loading){
      <i [class]="'ti ' + icon" aria-hidden="true"></i>
    }
      <span [class.visually-hidden]="loading"><ng-content></ng-content></span>
    </button>
