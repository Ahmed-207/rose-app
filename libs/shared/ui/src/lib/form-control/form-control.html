<div class="flex flex-col gap-2 w-full">

    @if(label) {
    <label class="text-sm font-medium text-zinc-700 dark:text-white" [for]="controlId">
        {{ label | translate }}

        @if(required) {
        <span class="text-red-500 dark:text-pink-300">*</span>
        }
    </label>
    }

    @switch(type) {

    @case('text') {
    <input pInputText [id]="controlId" [value]="value" [placeholder]="placeholder | translate" [disabled]="disabled" [readonly]="readonly"
        (input)="update($any($event.target).value)" />
    }

    @case('email') {
    <input pInputText [id]="controlId" type="email" [value]="value" [placeholder]="placeholder | translate" [disabled]="disabled"
        [readonly]="readonly" (input)="update($any($event.target).value)" />
    }

    @case('password') {

    <p-password [inputId]="controlId" [ngModel]="value" [feedback]="false" [disabled]="disabled" (ngModelChange)="update($event)"
        styleClass="w-full" inputStyleClass="w-full" />
    }

    @case('number') {

    <p-inputNumber [inputId]="controlId" [ngModel]="value" [disabled]="disabled" (ngModelChange)="update($event)" />
    }

    @case('textarea') {

    <textarea pTextarea [id]="controlId" rows="4" [disabled]="disabled" [placeholder]="placeholder | translate" [readonly]="readonly"
        (input)="update($any($event.target).value)">{{ value }}</textarea>

    }

    @case('select') {

    <p-select [inputId]="controlId" [options]="options" [optionLabel]="optionLabel" [optionValue]="optionValue" [ngModel]="value"
        [placeholder]="placeholder | translate" [disabled]="disabled" (ngModelChange)="update($event)" />
    }

    @case('multiselect') {

    <p-multiSelect [inputId]="controlId" [options]="options" [optionLabel]="optionLabel" [optionValue]="optionValue" [ngModel]="value"
        [disabled]="disabled" (ngModelChange)="update($event)" />
    }

    @case('checkbox') {

    <p-checkbox [inputId]="controlId" [binary]="true" [ngModel]="value" [disabled]="disabled" (ngModelChange)="update($event)" />
    }

    @case('switch') {

    <p-toggleswitch [inputId]="controlId" [ngModel]="value" [disabled]="disabled" (ngModelChange)="update($event)" />
    }

    @case('date') {

    <p-datepicker [inputId]="controlId" [ngModel]="value" [disabled]="disabled" (ngModelChange)="update($event)" />
    }

    @case('file') {
    <input [id]="controlId" type="file" [disabled]="disabled" [readonly]="readonly" [accept]="placeholder"
        (change)="fileSelected($event)" />
    }
    }
    @if(hasError){

    <small class="p-error">
        {{ errorMessage }}
    </small>

    }

</div>
